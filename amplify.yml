# AWS Amplify — Wiselista monorepo: web (Next.js) + mobile (Expo web)
# For web app: create Amplify app with app root = web
# For mobile (web) app: create Amplify app with app root = mobile — open URL in phone browser to test

version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            # Amplify console vars are build-only unless written for Next.js SSR/API routes.
            # https://docs.aws.amazon.com/amplify/latest/userguide/ssr-environment-variables.html
            - env | grep -e CLAID_API_KEY -e SUPABASE_SERVICE_ROLE_KEY -e STRIPE_SECRET_KEY -e STRIPE_WEBHOOK_SECRET -e WISELISTA_SKIP_PAYMENT >> .env.production
            - env | grep -e NEXT_PUBLIC_ >> .env.production
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*

  - appRoot: mobile
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
